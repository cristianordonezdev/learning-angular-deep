<div class="course-card">

    <div class="course-title">
      {{index}} {{course.description}}
    </div>
    @if (course.iconUrl) {
        <ng-content select="image-slot"></ng-content>
    }
    @else {
        <h5>No found image</h5>
    }

    <!--Container slots by default  -->
    <ng-content></ng-content>
    <ng-content select="description-slot"></ng-content>
    <button (click)="handleClick()">View course</button>

</div>
